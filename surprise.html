<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Final Surprise 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="surprise-page">

    <div class="surprise-hearts">
        💕 ✨ 💕 ✨ 💕
    </div>
    <audio id="bgMusic" loop>
        <source src="the_mountain-happy-birthday-508020.mp3" type="audio/mpeg">
    </audio>

    <main class="surprise-content">

        <p class="small-text">
            ✨ You made it till the end ✨
        </p>

        <h1>
            One Last Surprise... 🎁
        </h1>

        <div class="gift" onclick="openGift()">

            <div class="gift-lid">
                🎀
            </div>

            <div class="gift-box">
                🎁
            </div>

        </div>

        <p id="giftInstruction" class="gift-instruction">
            Tap the gift 🎁
        </p>

        <div id="finalMessage" class="final-message">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4VOyCtbWjBDyNlJt9wi9U2ukBm1E-2DIGMZ0wDTNArKfup_UFJ1EjCN25&s=10"
                alt="Cute kitten"
            >

            <h2>
                HAPPY BIRTHDAY! 🎂❤️
            </h2>

            <p>
                May your life always be filled with
                happiness, love, laughter and beautiful moments.
            </p>

            <h3>
                Keep smiling always! 🥹💕
            </h3>

            <div class="final-hearts">
                ❤️ ❤️ ❤️
            </div>

        </div>

        <button
            onclick="location.href='index.html'"
            class="restart-button"
        >
            Start Again 🔄
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
